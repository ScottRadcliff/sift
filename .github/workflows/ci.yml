name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd)"
          if [ -n "$unformatted" ]; then
            printf 'Run make fmt to format these files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test with race detection and coverage
        run: go test -race -count=1 -timeout=60s -coverprofile=coverage.out ./...

      - name: Build CLI
        run: go build -o bin/sift ./cmd/sift
